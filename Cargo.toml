[package]
edition      = "2024"
license      = "MIT"
name         = "xiaozhi-core"
rust-version = "1.88"
version = "1.0.0"
description  = "Pure logic core for the xiaozhi-s3 ESP32-S3 speaker firmware"
repository   = "https://github.com/1qingfeng-1/xiaozhi-core"
keywords     = ["esp32", "no_std", "xiaozhi", "audio"]
categories   = ["embedded", "no-std"]

# 纯逻辑核心层：no_std 兼容，可在 host (std) 上单元测试。
# 硬件相关代码（I2S/I2C 寄存器读写、DMA）放在 xiaozhi-s3 固件 crate。
#
# 本 crate 是独立 workspace 根：
# - 不继承父目录 .cargo/config.toml 里的 esp target / build-std / -nostartfiles
# - 因此 `cargo test` 默认在 host (x86_64) 上运行，无需额外 flag

# 空 workspace 根，避免向上查找父 workspace
[workspace]

[dependencies]
heapless = "0.8"

[dev-dependencies]
# 属性测试: 验证解析器对任意输入不 panic / 编解码往返一致
proptest = "1"
