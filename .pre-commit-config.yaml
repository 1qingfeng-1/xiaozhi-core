# xiaozhi-core 的 pre-commit 配置
# 复用 xiaozhi-s3 (esp 仓库) 的配置，去掉 esp-specific 的 cargo-deny / typos / markdownlint，
# clippy 改为 host 语义（core 是纯逻辑 crate，无 --all-features 概念）。
# 两个仓库共用同一套 hook，保证风格一致。
fail_fast: false
repos:
  # 通用文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=1024']

  # Rust 特定检查（host 语义）
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format files with rustfmt.
        entry: bash -c "cargo fmt --all -- --check"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint rust sources (host, pure-logic crate)
        entry: bash -c "cargo clippy --all-targets -- -D warnings"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: Check the package for errors.
        entry: bash -c "cargo check --all-targets"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-nextest
        name: cargo nextest
        description: Run unit tests with cargo-nextest (host)
        entry: bash -c "cargo nextest run"
        language: system
        files: \.rs$
        pass_filenames: false

# 排除不需要的文件
exclude: |
  (?x)^(
    target/.*|
    \.git/.*|
    \.github/.*|
    CHANGELOG\.md|
    \.pre-commit-config\.yaml|
    Cargo\.lock
  )$
