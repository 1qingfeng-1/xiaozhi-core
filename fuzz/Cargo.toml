[package]
name = "xiaozhi-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# 独立 workspace: 不继承 core 的构建配置
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.xiaozhi-core]
path = ".."

[[bin]]
name = "parse_ws"
path = "fuzz_targets/parse_ws.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_udp"
path = "fuzz_targets/parse_udp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_mqtt"
path = "fuzz_targets/parse_mqtt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_text"
path = "fuzz_targets/parse_text.rs"
test = false
doc = false
bench = false
